server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 2m;
    location = /health { access_log off; return 200 'ok'; }
    # Docker DNS resolves recreated upstream containers without reloading nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /api/planning/ {
        add_header Cache-Control "no-store" always;
        set $planning http://planning:8080;
        rewrite ^/api/planning/(.*)$ /$1 break;
        proxy_pass $planning;
        proxy_read_timeout 35s;
    }
    location /api/participation/ {
        add_header Cache-Control "no-store" always;
        set $participation http://participation:3000;
        rewrite ^/api/participation/(.*)$ /$1 break;
        proxy_pass $participation;
        proxy_read_timeout 35s;
    }
    # Internal endpoints and Decision are never browser-facing.
    location ~ ^/api/(planning|participation)/internal(?:/|$) { return 404; }
    location /api/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
